<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1d45"/><stop offset="1" stop-color="#060f22"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#064DFF" stop-opacity=".5"/><stop offset="1" stop-color="#064DFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#2f7bff"/><stop offset="1" stop-color="#b04dff"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#064DFF"/><stop offset="1" stop-color="#9B00FF"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#064DFF"/><stop offset="1" stop-color="#7a1dff"/></linearGradient>
    <style>text{font-family:Manrope,Inter,Arial,sans-serif}</style>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <circle cx="220" cy="140" r="170" fill="url(#glow)"/>

  <!-- laptop -->
  <rect x="52" y="34" width="296" height="186" rx="12" fill="#0a1530" stroke="#2a3f7a" stroke-width="4"/>
  <rect x="62" y="44" width="276" height="166" rx="6" fill="#0e1d44"/>
  <path d="M30 222H370L354 240H46Z" fill="#1a2b5a"/>
  <rect x="172" y="222" width="56" height="5" rx="2.5" fill="#0a1530"/>
  <!-- site nav -->
  <circle cx="78" cy="58" r="6" fill="url(#hero)"/>
  <rect x="88" y="55" width="30" height="6" rx="3" fill="#cfd9f2"/>
  <rect x="210" y="55" width="20" height="5" rx="2.5" fill="#5c6f99"/>
  <rect x="236" y="55" width="20" height="5" rx="2.5" fill="#5c6f99"/>
  <rect x="262" y="55" width="20" height="5" rx="2.5" fill="#5c6f99"/>
  <rect x="290" y="51" width="38" height="13" rx="6.5" fill="url(#btn)"/>
  <!-- site hero -->
  <rect x="76" y="82" width="118" height="12" rx="4" fill="url(#g)"/>
  <rect x="76" y="100" width="100" height="12" rx="4" fill="url(#g)"/>
  <rect x="76" y="120" width="112" height="5" rx="2.5" fill="#5c6f99"/>
  <rect x="76" y="130" width="90" height="5" rx="2.5" fill="#5c6f99"/>
  <rect x="76" y="146" width="62" height="18" rx="9" fill="url(#btn)"/>
  <rect x="212" y="78" width="112" height="86" rx="10" fill="url(#hero)"/>
  <circle cx="268" cy="121" r="22" fill="none" stroke="#fff" stroke-width="4" opacity=".7"/>
  <!-- site cards -->
  <rect x="76" y="176" width="76" height="24" rx="6" fill="#16275a"/>
  <rect x="162" y="176" width="76" height="24" rx="6" fill="#16275a"/>
  <rect x="248" y="176" width="76" height="24" rx="6" fill="#16275a"/>

  <!-- phone -->
  <rect x="356" y="82" width="96" height="190" rx="18" fill="#0a1530" stroke="#2a3f7a" stroke-width="3"/>
  <rect x="364" y="96" width="80" height="164" rx="11" fill="#0e1d44"/>
  <rect x="390" y="88" width="28" height="4" rx="2" fill="#2a3f7a"/>
  <rect x="372" y="106" width="64" height="58" rx="8" fill="url(#hero)"/>
  <rect x="372" y="172" width="58" height="8" rx="4" fill="url(#g)"/>
  <rect x="372" y="186" width="46" height="5" rx="2.5" fill="#5c6f99"/>
  <rect x="372" y="196" width="54" height="5" rx="2.5" fill="#5c6f99"/>
  <rect x="372" y="212" width="64" height="16" rx="8" fill="url(#btn)"/>
  <rect x="372" y="236" width="64" height="16" rx="5" fill="#16275a"/>

  <!-- cursor -->
  <g transform="translate(124 156)">
    <path d="M0 0L0 24 6 18 11 29 16 27 11 16 19 16Z" fill="#fff" stroke="#071126" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <circle cx="114" cy="155" r="14" fill="none" stroke="#00E5FF" stroke-width="2" opacity=".7"/>
</svg>
