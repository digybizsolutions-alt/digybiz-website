    <rect x="134" y="178" width="34" height="34" rx="7" fill="url(#reel)"/>
    <rect x="176" y="178" width="34" height="34" rx="7" fill="none" stroke="#2a3f7a" stroke-width="2"/>
    <rect x="218" y="178" width="30" height="34" rx="7" fill="url(#img)"/>

    <rect x="50" y="220" width="34" height="26" rx="7" fill="none" stroke="#2a3f7a" stroke-width="2"/>
    <rect x="92" y="220" width="34" height="26" rx="7" fill="#00E5FF"/>
    <rect x="134" y="220" width="34" height="26" rx="7" fill="none" stroke="#2a3f7a" stroke-width="2"/>
