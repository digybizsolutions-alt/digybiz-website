<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1d45"/><stop offset="1" stop-color="#060f22"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9B00FF" stop-opacity=".4"/><stop offset="1" stop-color="#9B00FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset=".55" stop-color="#064DFF"/><stop offset="1" stop-color="#9B00FF"/></linearGradient>
    <style>text{font-family:Manrope,Inter,Arial,sans-serif}</style>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <circle cx="240" cy="145" r="160" fill="url(#glow)"/>

  <!-- connections -->
  <g stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round" opacity=".7" fill="none">
    <path d="M118 78C170 78 180 120 205 128"/>
    <path d="M362 78C310 78 300 120 275 128"/>
    <path d="M118 222C170 222 180 180 205 168"/>
    <path d="M362 222C310 222 300 180 275 168"/>
  </g>

  <!-- gear ring -->
  <circle cx="240" cy="148" r="66" fill="none" stroke="#064DFF" stroke-width="12" stroke-dasharray="11 9" opacity=".45"/>
  <circle cx="240" cy="148" r="52" fill="#0b1835" stroke="#2a3f7a" stroke-width="2"/>

  <!-- robot -->
  <line x1="240" y1="108" x2="240" y2="96" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="240" cy="93" r="5" fill="#00E5FF"/>
  <rect x="206" y="108" width="68" height="58" rx="16" fill="url(#f)"/>
  <rect x="216" y="120" width="48" height="28" rx="9" fill="#071126"/>
  <circle cx="230" cy="134" r="5" fill="#00E5FF"/>
  <circle cx="250" cy="134" r="5" fill="#00E5FF"/>
  <path d="M232 156h16" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <rect x="198" y="128" width="8" height="18" rx="3" fill="#064DFF"/>
  <rect x="274" y="128" width="8" height="18" rx="3" fill="#064DFF"/>

  <!-- status pill -->
  <rect x="184" y="226" width="112" height="28" rx="14" fill="#0b1835" stroke="#19c25a" stroke-opacity=".7"/>
  <circle cx="202" cy="240" r="5" fill="#19c25a"/>
  <text x="248" y="244" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">Running 24/7</text>

  <!-- WhatsApp node -->
  <g transform="translate(62 50)">
    <rect width="56" height="56" rx="16" fill="#0b1835" stroke="#19c25a" stroke-width="2"/>
    <path d="M42 27a14 14 0 0 1-20.8 12.2L13 42l3-8.3A14 14 0 1 1 42 27z" fill="#19c25a"/>
    <path d="M22 24c0 5 4 9 9 9l2-2.5-3.4-1.6-1.6 1.3a6 6 0 0 1-2.8-2.8l1.3-1.6-1.6-3.4z" fill="#fff"/>
  </g>
  <!-- Email node -->
  <g transform="translate(362 50)">
    <rect width="56" height="56" rx="16" fill="#0b1835" stroke="#00E5FF" stroke-width="2"/>
    <rect x="12" y="17" width="32" height="22" rx="4" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <path d="M13 19l15 11 15-11" fill="none" stroke="#00E5FF" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Sheet node -->
  <g transform="translate(62 194)">
    <rect width="56" height="56" rx="16" fill="#0b1835" stroke="#2f6bff" stroke-width="2"/>
    <rect x="14" y="13" width="28" height="30" rx="3" fill="#2f6bff"/>
    <path d="M14 23h28M14 33h28M24 13v30" stroke="#0b1835" stroke-width="2.5"/>
  </g>
  <!-- Bell node -->
  <g transform="translate(362 194)">
    <rect width="56" height="56" rx="16" fill="#0b1835" stroke="#b36bff" stroke-width="2"/>
    <path d="M18 34c3-3 3-6 3-11a7 7 0 0 1 14 0c0 5 0 8 3 11z" fill="#b36bff"/>
    <circle cx="28" cy="39" r="3.5" fill="#b36bff"/>
    <circle cx="38" cy="17" r="5" fill="#ff4d7d"/>
  </g>
</svg>
