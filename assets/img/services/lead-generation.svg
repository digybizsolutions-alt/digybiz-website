<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1d45"/><stop offset="1" stop-color="#060f22"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#064DFF" stop-opacity=".55"/><stop offset="1" stop-color="#064DFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#064DFF"/><stop offset="1" stop-color="#9B00FF"/></linearGradient>
    <style>text{font-family:Manrope,Inter,Arial,sans-serif}</style>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <circle cx="240" cy="150" r="170" fill="url(#glow)"/>

  <!-- visitors dropping into the funnel -->
  <g fill="#9fb0d3">
    <circle cx="170" cy="40" r="8"/><path d="M158 64a12 12 0 0 1 24 0z"/>
    <circle cx="212" cy="30" r="8" fill="#00E5FF"/><path d="M200 54a12 12 0 0 1 24 0z" fill="#00E5FF"/>
    <circle cx="256" cy="42" r="8"/><path d="M244 66a12 12 0 0 1 24 0z"/>
    <circle cx="300" cy="32" r="8" fill="#b36bff"/><path d="M288 56a12 12 0 0 1 24 0z" fill="#b36bff"/>
  </g>

  <!-- funnel -->
  <ellipse cx="240" cy="92" rx="100" ry="10" fill="#00E5FF" opacity=".35"/>
  <path d="M140 92H340L300 140H180Z" fill="url(#f)"/>
  <path d="M186 148H294L268 186H212Z" fill="url(#f)" opacity=".85"/>
  <path d="M216 194H264L252 222H228Z" fill="url(#f)" opacity=".7"/>
  <text x="240" y="122" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" letter-spacing="2">ATTRACT</text>
  <text x="240" y="172" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" letter-spacing="1.5">QUALIFY</text>
  <path d="M240 226V242" stroke="#00E5FF" stroke-width="3" stroke-linecap="round"/>

  <!-- lead card -->
  <rect x="166" y="246" width="148" height="42" rx="12" fill="#0b1835" stroke="#00E5FF" stroke-opacity=".6"/>
  <circle cx="189" cy="267" r="11" fill="#19c25a"/>
  <path d="M184 267l4 4 7-8" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="208" y="264" font-size="12" font-weight="800" fill="#fff">New Lead</text>
  <text x="208" y="279" font-size="9.5" fill="#9fb0d3">Qualified · Ready to talk</text>

  <!-- target on the left -->
  <g transform="translate(70 160)">
    <circle r="36" fill="none" stroke="#064DFF" stroke-width="5"/>
    <circle r="23" fill="none" stroke="#00E5FF" stroke-width="5"/>
    <circle r="9" fill="#9B00FF"/>
    <path d="M44 -44L4 -4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M44 -44l-12 2M44 -44l-2 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- growth card on the right -->
  <g transform="translate(362 120)">
    <rect width="96" height="84" rx="14" fill="#0b1835" stroke="#2a3f7a"/>
    <text x="12" y="20" font-size="10" font-weight="700" fill="#9fb0d3">LEADS</text>
    <rect x="14" y="54" width="12" height="18" rx="3" fill="#064DFF"/>
    <rect x="32" y="46" width="12" height="26" rx="3" fill="#2f6bff"/>
    <rect x="50" y="36" width="12" height="36" rx="3" fill="#00B8FF"/>
    <rect x="68" y="26" width="12" height="46" rx="3" fill="#00E5FF"/>
  </g>
</svg>
